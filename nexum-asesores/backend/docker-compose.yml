# ============================================================
# Nexum Asesores — Docker Compose
# Stack completo local para desarrollo
# Servicios: PostgreSQL · MinIO · Airflow · FastAPI
# ============================================================
# Uso:
#   docker compose up -d
#   docker compose logs -f nexum-api
#   docker compose down -v   ← destruye volúmenes
# ============================================================

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nexum:nexum_secret@postgres:5432/nexum_airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    NEXUM_JWT_SECRET: "${NEXUM_JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}"
    NEXUM_DB_URL: "postgresql+asyncpg://nexum:nexum_secret@postgres:5432/nexum_db"
    NEXUM_MODEL_DIR: "/models/nexum"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./models:/opt/airflow/models
    - ./etl:/opt/airflow/plugins/nexum_etl
    - airflow-logs:/opt/airflow/logs
    - models-volume:/models
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL — Silver + Gold + Airflow ────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexum-postgres
    environment:
      POSTGRES_USER: nexum
      POSTGRES_PASSWORD: nexum_secret
      POSTGRES_DB: nexum_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./db/schema_silver.sql:/docker-entrypoint-initdb.d/01_silver.sql
      - ./db/schema_gold.sql:/docker-entrypoint-initdb.d/02_gold.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexum -d nexum_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO — Bronze layer ─────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    container_name: nexum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     nexum_minio
      MINIO_ROOT_PASSWORD: nexum_minio_secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── MinIO: crear bucket nexum-bronze automáticamente ─────────
  minio-init:
    image: minio/mc:latest
    container_name: nexum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        mc alias set nexum http://minio:9000 nexum_minio nexum_minio_secret &&
        mc mb --ignore-existing nexum/nexum-bronze &&
        mc mb --ignore-existing nexum/nexum-models &&
        echo 'MinIO inicializado'
      "

  # ── Airflow — Init DB ────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: nexum-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Nexum \
          --lastname Admin \
          --role Admin \
          --email admin@nexumasesores.es
    restart: "no"

  # ── Airflow — Webserver ──────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nexum-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow — Scheduler ──────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nexum-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI — Backend ────────────────────────────────────────
  nexum-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexum-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      NEXUM_JWT_SECRET: "${NEXUM_JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}"
      NEXUM_DB_URL: "postgresql+asyncpg://nexum:nexum_secret@postgres:5432/nexum_db"
      NEXUM_MODEL_DIR: "/models/nexum"
    volumes:
      - .:/app
      - models-volume:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  models-volume:

networks:
  default:
    name: nexum-network
